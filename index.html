<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Özür Dilerim ❤️</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    min-height: 100dvh;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: linear-gradient(
        135deg,
        #ff9a9e,
        #fad0c4
    );
}

/* ANA KUTU */

.kutu {
    width: calc(100% - 32px);
    max-width: 390px;

    padding: 32px 20px;

    text-align: center;

    background: rgba(255, 255, 255, 0.94);

    border-radius: 26px;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.15);

    z-index: 10;
}

h1 {
    margin: 0 0 18px;

    color: #ff4f81;

    font-size: clamp(28px, 8vw, 36px);

    text-shadow:
        0 0 10px rgba(255, 79, 129, 0.3);
}

#mesaj {
    min-height: 125px;

    margin: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    flex-direction: column;

    color: #444;

    font-size: clamp(18px, 5vw, 21px);

    line-height: 1.5;
}

/* BUTONLAR */

button {
    border: none;
    border-radius: 15px;

    min-width: 120px;
    min-height: 52px;

    padding: 12px 20px;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    touch-action: manipulation;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

#evet {
    margin: 8px;

    color: white;
    background: #ff4f81;

    box-shadow:
        0 8px 20px rgba(255, 79, 129, 0.35);

    transform-origin: center;
}

#hayir {
    margin: 8px;

    color: #555;
    background: #eeeeee;

    position: relative;

    z-index: 20;
}

/* UÇUŞAN YAZILAR */

.tesekkur {
    position: fixed;

    left: 50%;
    top: 50%;

    z-index: 100;

    color: #ff3f7f;

    font-size: clamp(20px, 6vw, 30px);

    font-weight: bold;

    white-space: nowrap;

    pointer-events: none;

    animation: ucus 2.8s ease-out forwards;

    text-shadow:
        0 0 10px rgba(255, 63, 127, 0.35);
}

@keyframes ucus {

    0% {
        transform:
            translate(0, 0)
            scale(0.7)
            rotate(0deg);

        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform:
            translate(var(--x), var(--y))
            scale(1.1)
            rotate(var(--donus));

        opacity: 0;
    }
}

/* KALPLER */

.kalp {
    position: fixed;

    bottom: -40px;

    font-size: 25px;

    z-index: 5;

    pointer-events: none;

    animation: yukari 5s linear forwards;
}

@keyframes yukari {

    0% {
        transform:
            translateY(0)
            scale(0.7);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-110vh)
            scale(1.3)
            rotate(20deg);

        opacity: 0;
    }
}

/* TELEFON */

@media (max-width: 350px) {

    .kutu {
        padding: 26px 15px;
    }

    button {
        min-width: 105px;
        font-size: 16px;
    }
}

/* YATAY TELEFON */

@media (orientation: landscape) {

    .kutu {
        padding: 20px;
    }

    #mesaj {
        min-height: 90px;
    }
}
</style>
</head>

<body>

<div class="kutu" id="anaKutu">

    <h1>Özür Dilerim ❤️</h1>

    <p id="mesaj">
        Seni kırdığım için gerçekten çok özür dilerim. 🥺
        <br>
        Barışalım mı?
    </p>

    <button id="evet">
        Evet ❤️
    </button>

    <button id="hayir">
        Hayır 😢
    </button>

</div>


<script>

const hayir = document.getElementById("hayir");
const evet = document.getElementById("evet");
const mesaj = document.getElementById("mesaj");
const anaKutu = document.getElementById("anaKutu");


/* EVET'İN BÜYÜKLÜĞÜ */

let boyut = 18;


/* MESAJLAR SIRAYLA DEĞİŞECEK */

const mesajlar = [

    "Emin misin? 🥺",

    "Bir daha düşünsen? 😭",

    "Ama gerçekten çok özür dilerim... 🥹",

    "Kalbini kırmak istememiştim. ❤️",

    "Lütfen bir şans daha ver. 🥺",

    "Bak Evet butonu da büyüyor. 😂",

    "Hayır demeye çalışsan da kaçıyorum. 😭",

    "Son kez soruyorum... 🥹",

    "Gerçekten barışamaz mıyız? ❤️",

    "Çok pişmanım. 🥺",

    "Hadi barışalım artık. ❤️",

    "Lütfen Evet'e bas. 🥹❤️"

];

let mesajSirasi = 0;


/* HAYIR BUTONU */

hayir.addEventListener("click", function () {

    /* EVET BÜYÜSÜN */

    boyut += 5;

    evet.style.transform =
        "scale(" + (boyut / 18) + ")";


    /* HAYIR EKRAN DIŞINA ÇIKMASIN */

    const margin = 20;

    const butonGenislik =
        hayir.offsetWidth;

    const butonYukseklik =
        hayir.offsetHeight;

    const maxX =
        window.innerWidth -
        butonGenislik -
        margin;

    const maxY =
        window.innerHeight -
        butonYukseklik -
        margin;


    const x =
        margin +
        Math.random() *
        Math.max(1, maxX - margin);


    const y =
        margin +
        Math.random() *
        Math.max(1, maxY - margin);


    hayir.style.position = "fixed";

    hayir.style.left = x + "px";

    hayir.style.top = y + "px";


    /* MESAJ SIRAYLA DEĞİŞSİN */

    mesaj.innerHTML =
        mesajlar[mesajSirasi];


    mesajSirasi++;

    if (mesajSirasi >= mesajlar.length) {

        mesajSirasi = 0;

    }

});


/* EVET'E BASILINCA */

evet.addEventListener("click", function () {

    /* ANA KUTUYU GİZLE */

    anaKutu.style.display = "none";


    /* UÇUŞAN YAZILAR */

    const yazilar = [

        "Teşekkür ederim ❤️",

        "İyi ki varsın 🥹",

        "Özür dilerim ❤️",

        "Seni üzmek istememiştim 🥺",

        "Barıştık! ❤️",

        "Çok mutlu oldum 🥹",

        "İyi ki benimlesin ❤️",

        "Her şey için özür dilerim 🥺",

        "Teşekkür ederim güzelim ❤️",

        "Seni kırdığım için pişmanım 🥹"

    ];


    yazilar.forEach(function (yazi, index) {

        setTimeout(function () {

            ucusanYazi(yazi);

        }, index * 350);

    });

});


/* UÇUŞAN YAZI OLUŞTUR */

function ucusanYazi(yazi) {

    const element =
        document.createElement("div");

    element.className =
        "tesekkur";

    element.innerHTML =
        yazi;


    /*
       Yazılar farklı yönlere uçsun
    */

    const x =
        (Math.random() - 0.5) * 600;

    const y =
        (Math.random() - 0.5) * 600;


    const donus =
        (Math.random() - 0.5) * 40;


    element.style.setProperty(
        "--x",
        x + "px"
    );

    element.style.setProperty(
        "--y",
        y + "px"
    );

    element.style.setProperty(
        "--donus",
        donus + "deg"
    );


    /*
       Başlangıç noktası
       ekranın farklı yerlerinde olsun
    */

    element.style.left =
        (20 + Math.random() * 60) + "vw";

    element.style.top =
        (20 + Math.random() * 60) + "vh";


    document.body.appendChild(element);


    setTimeout(function () {

        element.remove();

    }, 3000);

}


/* ARKA PLANDA UÇAN KALPLER */

setInterval(function () {

    const kalp =
        document.createElement("div");

    kalp.className =
        "kalp";

    kalp.innerHTML =
        "❤️";


    kalp.style.left =
        Math.random() * 100 + "vw";


    kalp.style.fontSize =
        (18 + Math.random() * 20) + "px";


    document.body.appendChild(kalp);


    setTimeout(function () {

        kalp.remove();

    }, 5000);

}, 500);

</script>

</body>
</html>
